name: Build, Publish & Deploy Backend

on:
  push:
    branches: ["main", "dev"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main", "dev"]
  workflow_dispatch:

# Prevent concurrent builds from racing and pushing out-of-order images to GHCR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  CONTAINER_APP_NAME: ca-skillhub-backend
  RESOURCE_GROUP: TalentMatch-RG

jobs:
  build-publish-deploy:
    name: Build, Publish & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # GHCR requires strictly lowercase repository names (e.g., chamiya09/skill-hub-backend)
      - name: Lowercase image name
        id: prep
        run: |
          echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Authenticate to GHCR using the built-in GITHUB_TOKEN (granted 'packages: write' permission above)
      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.prep.outputs.image }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=dev-latest,enable=${{ github.ref == 'refs/heads/dev' }}
            type=sha,prefix=sha-,format=short
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=ref,event=pr

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          # Only push to registry on pushes or workflow_dispatch, not during Pull Requests
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Extract the generated short-SHA image tag for Azure deployment
      - name: Extract SHA image tag for deploy
        if: github.event_name != 'pull_request'
        id: deploy-tag
        run: |
          DEPLOY_IMAGE=$(echo "${{ steps.meta.outputs.tags }}" | grep ':sha-' | head -n 1)
          echo "image=${DEPLOY_IMAGE}" >> $GITHUB_OUTPUT

      # Authenticate with Azure using Service Principal credentials (AZURE_CREDENTIALS JSON)
      - name: Log in to Azure
        if: github.event_name != 'pull_request'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Deploy ONLY the new container image to Azure Container Apps
      # az containerapp update strictly preserves all existing environment variables, secrets, and configurations
      - name: Deploy to Azure Container Apps (Preserve Environment Variables)
        if: github.event_name != 'pull_request'
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az containerapp update \
              --name "${{ env.CONTAINER_APP_NAME }}" \
              --resource-group "${{ env.RESOURCE_GROUP }}" \
              --image "${{ steps.deploy-tag.outputs.image }}"
