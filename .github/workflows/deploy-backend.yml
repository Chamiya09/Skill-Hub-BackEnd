name: Build, Publish & Deploy Backend

on:
  push:
    branches: ["main", "dev"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main", "dev"]
  workflow_dispatch:

# Prevent concurrent builds from racing and pushing out-of-order images to GHCR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  CONTAINER_APP_NAME: ca-skillhub-backend
  RESOURCE_GROUP: TalentMatch-RG

jobs:
  build-publish-deploy:
    name: Build, Publish & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # Required for passwordless Azure OIDC authentication

    steps:
      # 1. Checkout repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. GHCR strictly requires lowercase repository names
      - name: Lowercase image name
        id: prep
        run: |
          echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      # 3. Setup Docker Buildx for modern caching and multi-platform support
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. Authenticate to GHCR using ONLY the built-in GITHUB_TOKEN (Zero PAT required)
      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 5. Generate Docker tags & labels automatically based on git refs
      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.prep.outputs.image }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=dev-latest,enable=${{ github.ref == 'refs/heads/dev' }}
            type=sha,prefix=sha-,format=short
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=ref,event=pr

      # 6. Build and push Docker image to GHCR
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          # Push image on branch pushes and manual triggers; skip on PRs (validation only)
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 7. Extract the short-SHA image tag for deterministic Azure deployment
      - name: Extract SHA image tag for deploy
        if: github.event_name != 'pull_request'
        id: deploy-tag
        run: |
          DEPLOY_IMAGE=$(echo "${{ steps.meta.outputs.tags }}" | grep ':sha-' | head -n 1)
          echo "image=${DEPLOY_IMAGE}" >> $GITHUB_OUTPUT

      # 8. Authenticate to Azure using OpenID Connect (OIDC) via GitHub Secrets
      - name: Log in to Azure (OIDC)
        if: github.event_name != 'pull_request'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # 9. Deploy ONLY the new image to Azure Container Apps
      # Note: No registry credentials configured since the GHCR package is public.
      # 'az containerapp update --image' strictly updates the image and preserves ALL existing environment variables, secrets, and configurations.
      - name: Deploy to Azure Container Apps (Preserve Environment Variables)
        if: github.event_name != 'pull_request'
        uses: azure/CLI@v2
        with:
          inlineScript: |
            echo "Deploying image: ${{ steps.deploy-tag.outputs.image }}"
            az containerapp update \
              --name "${{ env.CONTAINER_APP_NAME }}" \
              --resource-group "${{ env.RESOURCE_GROUP }}" \
              --image "${{ steps.deploy-tag.outputs.image }}"
